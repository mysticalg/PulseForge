[package]
name = "pulseforge"
version = "0.10.8"
description = "Altcoin market scanner with paper and explicitly activated live wallet sessions"
authors = ["PulseForge contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pulseforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
bincode = "1.3.3"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
keyring-core = "1.0.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
solana-sdk = "4.1.0"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.9.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled"] }
