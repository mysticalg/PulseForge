name: Build Linux and macOS downloads
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux-x64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: macos-14, platform: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --ci
        env:
          NO_STRIP: 'true'
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} "$RUNNER_TEMP/downloads/" \;
          cd "$RUNNER_TEMP/downloads"
          test -n "$(ls)"
          shasum -a 256 * > "PulseForge-0.10.8-$PLATFORM.sha256"
          gh release upload v0.10.8 ./* --repo "$GITHUB_REPOSITORY" --clobber
